name: Perubahan konten (Content change)
description: Usulkan perubahan teks atau konten halaman situs (Copy change for site pages)
title: "[Konten]: "
labels: ["content"]
body:
  - type: input
    id: page
    attributes:
      label: Halaman (Page)
      placeholder: /faq
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Teks saat ini (Current text)
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Teks usulan (Proposed text)
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Alasan (Reason)
  - type: checkboxes
    id: confirm
    attributes:
      label: Konfirmasi
      options:
        - label: Ini bukan masalah keamanan (this is not a security issue)
          required: true
