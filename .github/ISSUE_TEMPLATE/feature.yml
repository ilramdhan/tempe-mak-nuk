name: Fitur baru (Feature request)
description: Usulkan fitur atau peningkatan (Suggest an idea)
title: "[Fitur]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ingin diselesaikan (Problem)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan solusi (Proposed solution)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatif yang dipertimbangkan (Alternatives)
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Situs publik (Site)
        - Admin
        - Database
        - Auth / izin (Permissions)
        - SEO
        - Lainnya (Other)
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Konfirmasi
      options:
        - label: Ini bukan masalah keamanan (this is not a security issue)
          required: true
