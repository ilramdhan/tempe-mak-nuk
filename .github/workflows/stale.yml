name: Stale

on:
  schedule:
    - cron: "41 2 * * 1" # Monday 02:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,a11y
          exempt-pr-labels: security,a11y
          exempt-draft-pr: true
          stale-issue-message: >
            Issue ini tidak aktif selama 60 hari dan ditandai `stale`. Akan ditutup dalam 14 hari
            jika tidak ada aktivitas.
          stale-pr-message: >
            PR ini tidak aktif selama 30 hari dan ditandai `stale`. Akan ditutup dalam 14 hari
            jika tidak ada aktivitas.
