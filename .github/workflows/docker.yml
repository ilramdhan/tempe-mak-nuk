name: Docker

# Image: ghcr.io/ilramdhan/tempe-mak-nuk (docs/deploy.md § "Self-host dengan Docker").
#
# - pull_request: amd64 build + Trivy gate, no push. `next build` needs a database
#   (generateStaticParams must return ≥1 slug), so it runs against a seeded Postgres service
#   container reachable from BuildKit over host networking — same data/dummy env as ci.yml.
# - workflow_call (release-please, on a new release) / workflow_dispatch: multi-arch build
#   against the production DB (secret DOCKER_BUILD_DATABASE_URL, mounted as a BuildKit
#   secret — never a build-arg or layer), Trivy gate on amd64, push, SBOM + provenance, cosign
#   keyless signature by digest.
#
# Repo configuration (Settings → Secrets and variables → Actions):
#   vars.NEXT_PUBLIC_SITE_URL, vars.NEXT_PUBLIC_SUPABASE_URL, vars.NEXT_PUBLIC_SUPABASE_ANON_KEY
#   secrets.DOCKER_BUILD_DATABASE_URL (pooler 6543, used only while prerendering)

on:
  workflow_call:
    inputs:
      version:
        description: Release version without "v" (e.g. 0.2.0). Empty → sha tag only.
        type: string
        required: false
        default: ""
      tag:
        description: Git tag to build (e.g. v0.2.0). Empty → the triggering commit.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Release version without "v" (e.g. 0.2.0). Empty → sha tag only (no latest).
        type: string
        required: false
        default: ""
      tag:
        description: Git tag to build (e.g. v0.2.0). Empty → selected branch HEAD.
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ilramdhan/tempe-mak-nuk

jobs:
  pr-build:
    name: Build (amd64, no push) + Trivy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tempe
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tempe
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tempe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare build database (bootstrap, migrate, seed)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/bootstrap.sql
          pnpm tsx scripts/dev/migrate.mts
          pnpm db:seed

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          network: host
          allow: network.host
          load: true
          push: false
          tags: tempe-mak-nuk:pr-${{ github.event.pull_request.number }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://tempemaknuk.com
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-dummy-anon-key
          secrets: |
            database_url=${{ env.DATABASE_URL }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64

      - name: Trivy (CRITICAL/HIGH with a fix → fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tempe-mak-nuk:pr-${{ github.event.pull_request.number }}
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

  publish:
    name: Build, scan, push, sign (amd64 + arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless (Fulcio OIDC)
      security-events: write # Trivy SARIF → code scanning (category "trivy-image")
    env:
      BUILD_ARGS: |
        NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
        NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Check required vars/secrets
        env:
          HAS_DB: ${{ secrets.DOCKER_BUILD_DATABASE_URL != '' }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=()
          [ "$HAS_DB" = "true" ] || missing+=("secret DOCKER_BUILD_DATABASE_URL")
          [ -n "$SITE_URL" ] || missing+=("var NEXT_PUBLIC_SITE_URL")
          [ -n "$SUPABASE_URL" ] || missing+=("var NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$ANON_KEY" ] || missing+=("var NEXT_PUBLIC_SUPABASE_ANON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing %s (see docs/deploy.md, Self-host dengan Docker)\n' "${missing[@]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      # Gate before anything is pushed: amd64 build loaded into the runner's docker, scanned.
      - name: Build (amd64, for scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: tempe-mak-nuk:scan
          build-args: ${{ env.BUILD_ARGS }}
          secrets: |
            database_url=${{ secrets.DOCKER_BUILD_DATABASE_URL }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64

      # Vulnerabilities only: the secret scanner flags NEXT_PUBLIC_SUPABASE_ANON_KEY, a public
      # JWT that is baked into the client bundle by design (secrets are covered by GitHub
      # secret scanning + push protection on the repo).
      - name: Trivy report (SARIF → code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tempe-mak-nuk:scan
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy (CRITICAL/HIGH with a fix → fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          image-ref: tempe-mak-nuk:scan
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build args (public NEXT_PUBLIC_* only) are recorded in provenance mode=max; the DB URL
      # is a secret mount and is not.
      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ env.BUILD_ARGS }}
          secrets: |
            database_url=${{ secrets.DOCKER_BUILD_DATABASE_URL }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-multiarch
          cache-to: type=gha,mode=max,scope=docker-multiarch
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, by digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image pushed"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
